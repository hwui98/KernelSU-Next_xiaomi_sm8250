name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            curl \
            wget \
            bc \
            bison \
            flex \
            build-essential \
            zip \
            unzip \
            cpio \
            rsync \
            libssl-dev \
            libelf-dev \
            python3

      - name: Show tree
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f | head -100
