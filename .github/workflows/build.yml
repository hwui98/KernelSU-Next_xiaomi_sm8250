name: Build UMI Kernel with KSU-Next + DroidSpaces

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3G
          key: kernel-umi-ksu-${{ github.sha }}

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex git libelf-dev \
            libssl-dev lld llvm python3 rsync unzip wget zip

      - name: Download Clang
        run: |
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250129-release/Clang-20.0.0git-20250129.tar.gz -O clang.tar.gz
          mkdir -p clang && tar -xzf clang.tar.gz -C clang --strip-components=1
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Prepare Defconfig + DroidSpaces
        run: |
          set -euo pipefail
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          echo "=== Generating umi defconfig ==="
          make O=out ARCH=arm64 umi_defconfig
          
          echo "=== Appending DroidSpaces.config ==="
          cat DroidSpaces.config >> out/.config
          
          echo "=== Running olddefconfig ==="
          make O=out ARCH=arm64 olddefconfig

      - name: Config Check (KSU + DroidSpaces)
        run: |
          echo "===== Kernel Config Check ====="
          echo "KernelSU status:"
          grep -E "CONFIG_KERNELSU|KSU" out/.config || echo "KernelSU not found in .config (may be patched)"
          echo ""
          echo "DroidSpaces related:"
          grep -E "CONFIG_(PID|IPC|UTS|USER|NET)_NS|CONFIG_OVERLAY_FS|CONFIG_SECCOMP" out/.config || true
          echo "=============================="

      - name: Build Kernel
        run: |
          set -euo pipefail
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          echo "=== Starting Kernel Build ==="
          echo "Start time: $(date)"
          
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            2>&1 | tee build.log
          
          echo "=== Build finished at: $(date) ==="

      - name: Show Last 200 Lines if Failed
        if: failure()
        run: |
          echo "❌ BUILD FAILED! Showing last 200 lines of log:"
          echo "============================================"
          tail -n 200 build.log
          echo "============================================"
          echo "🔍 Please check the full build.log in Artifacts for more details."

      - name: Upload Build Log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-umi
          path: build.log

      - name: Upload Kernel Artifacts (on success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MagicTime-KSU-Next_umi
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
